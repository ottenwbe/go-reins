name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: build, make check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all packages
        run: go build ./...

      - name: Check (gofmt, vet, test, SBOM freshness)
        run: make check
